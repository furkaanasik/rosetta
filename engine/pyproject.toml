[project]
name = "rosetta-engine"
version = "0.1.0"
description = "Rosetta translation engine: PDF block extraction, LLM translation cache, reflow HTML"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Furkan Asik", email = "furkaanasik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "platformdirs>=4",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
rosetta = "rosetta_engine.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv.build-backend]
module-name = "rosetta_engine"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real claude CLI (costs tokens)"]
